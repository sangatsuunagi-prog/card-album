<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c">
<meta name="robots" content="noindex, nofollow">
<!-- home-screen app: icon and full-screen launch -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カードアルバム">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>カードアルバム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;700&family=DotGothic16&family=Libre+Caslon+Text:ital@0;1&family=Noto+Sans+JP:wght@400;500;700;900&family=Dela+Gothic+One&family=RocknRoll+One&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Zen+Old+Mincho:wght@700;900&family=Zen+Antique&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&family=Yusei+Magic&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
<style>
  :root{
    --ink:#17140f;
    --paper:#c9c6bf;
    --accent:#b5482f;
    --star:#e6b52e;  /* rating stars, the same on every card */
    --bg:#0f0e0c;
    --panel:#1b1b1b;
    --panel-2:#2a2a26;
    --border:#3d3b34;
    --text:#efe9df;
    --muted:#a39c8c;
    --dim:#7d766a;
    /* album / viewer background (changeable from the menu) */
    --app-bg:#0f0e0c;
    --on-app:#efe9df;
    --on-app-muted:#7d766a;
    --app-line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    min-height:100vh;
    background:var(--app-bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
  }
  /* optional photo background (a fixed layer, since iOS ignores background-attachment:fixed) */
  body.has-bg-image{background:transparent;}
  body.has-bg-image::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:linear-gradient(var(--app-scrim), var(--app-scrim)), var(--app-bg-image) center / cover no-repeat;
  }
  .bg-img-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
  body.locked{overflow:hidden;}
  button{font-family:inherit;}
  [hidden]{display:none !important;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--app-bg);
    background:color-mix(in srgb, var(--app-bg) 92%, transparent);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    padding:calc(14px + env(safe-area-inset-top)) 16px 0;
    border-bottom:1px solid var(--app-line);
    color:var(--on-app);
  }
  .topbar .icon-btn, .viewer .icon-btn{color:var(--on-app);}
  .topbar .icon-btn:active, .viewer .icon-btn:active{background:var(--app-line);}
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:960px;
    margin:0 auto;
  }
  .topbar h1{
    font-family:'Zen Antique', serif;
    font-weight:400;
    font-size:24px;
    letter-spacing:.04em;
    margin:0;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text);
    font-size:22px;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
  }
  .icon-btn:active{background:#2a2925;}
  .tabs{
    display:flex;
    gap:4px;
    max-width:960px;
    margin:10px auto 0;
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    color:var(--on-app-muted);
    font-family:'Zen Antique', serif;
    font-size:13px;
    font-weight:400;
    letter-spacing:.06em;
    padding:10px 0 12px;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab.active{color:var(--on-app);border-bottom-color:var(--accent);}
  .tab .n{font-size:11px;margin-left:4px;color:var(--on-app-muted);}
  .toolbar{
    display:flex;
    gap:8px;
    max-width:960px;
    margin:12px auto 0;
  }
  /* search, sort and the ⋯ menu stay tucked away until the list is pulled down */
  .topbar .toolbar, .topbar #menuBtn{transition:max-height .25s, margin .25s, opacity .2s, visibility .2s;}
  .topbar .toolbar{max-height:60px;}
  .topbar:not(.tools-open) .toolbar{max-height:0;margin-top:0;opacity:0;visibility:hidden;overflow:hidden;}
  .topbar:not(.tools-open) #menuBtn{opacity:0;visibility:hidden;}
  .toolbar input, .toolbar select{
    background:var(--app-line);
    border:1px solid var(--app-line);
    color:var(--on-app);
    border-radius:999px;
    font-family:inherit;
    font-size:16px;  /* 16px keeps iOS from zooming in on focus */
    padding:8px 14px;
    outline:none;
  }
  .toolbar input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;}
  .toolbar input::placeholder{color:var(--on-app-muted);}
  .toolbar input:focus{border-color:var(--accent);}
  .toolbar select{
    flex-shrink:0;
    width:auto;
    font-size:14px;
  }
  .toolbar select option{color:#17140f;}

  .menu{
    position:absolute;
    right:16px;
    top:calc(56px + env(safe-area-inset-top));
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:20;
    min-width:200px;
  }
  .menu button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--text);
    font-size:14px;
    padding:14px 16px;
    cursor:pointer;
  }
  .menu button + button{border-top:1px solid var(--border);}
  .menu button:active{background:#33322c;}

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
    padding:18px 16px calc(110px + env(safe-area-inset-bottom));
    max-width:960px;
    margin:0 auto;
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3, 1fr);gap:20px;} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4, 1fr);} }
  .grid .card-wrap{cursor:pointer;transition:transform .15s;}
  .grid .card-wrap:active{transform:scale(.97);}
  .grid .card{box-shadow:0 8px 24px rgba(0,0,0,.45);}

  .empty-state{
    text-align:center;
    color:var(--on-app-muted);
    font-size:14px;
    line-height:1.9;
    padding:80px 24px;
  }
  .empty-state .big{font-size:40px;display:block;margin-bottom:8px;}

  .fab{
    position:fixed;
    right:20px;
    bottom:calc(24px + env(safe-area-inset-bottom));
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:30px;
    line-height:1;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    cursor:pointer;
    z-index:5;
  }
  .fab:active{transform:scale(.94);}

  /* ---------- card (fixed 3:5; sizes scale with the card width) ---------- */
  .card-wrap{container-type:inline-size;width:100%;}
  .card{
    width:100%;
    aspect-ratio:3/5;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    padding:4.1cqw;
    overflow:hidden;
    --ink-rgb:23,20,15;
  }
  /* dark card colors (e.g. bordeaux) switch the text to light */
  .card.dark{--ink:#f3ece0;--ink-rgb:243,236,224;}
  .art{
    width:100%;
    aspect-ratio:1/1;
    flex-shrink:0;
    background-color:rgba(var(--ink-rgb),.12);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(var(--ink-rgb),.45);
    font-size:3.4cqw;
  }
  .art.empty::after{content:'NO IMAGE';letter-spacing:.1em;}
  .info, .info-holder{flex:1;min-height:0;display:flex;flex-direction:column;}
  .info{padding:1.5cqw 1.5cqw 0;}
  /* every row has a fixed height, so empty items keep their space */
  .title-row{
    flex-shrink:0;
    height:21cqw;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:2.6cqw;
    border-bottom:.5cqw solid var(--ink);
    padding-bottom:2cqw;
    margin-bottom:2cqw;
  }
  /* the font picked in the editor applies to the title, year and item values */
  .title-row .t, .title-row .y, .meta-line .v{font-family:var(--card-font, 'Noto Sans JP', sans-serif);}
  .title-row .t{
    font-weight:900;
    font-size:8cqw;
    line-height:1.25;
    letter-spacing:.01em;
    word-break:break-word;
    min-width:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    /* a roomy line height plus a little padding keeps descenders (g, y, p) visible on every font;
       the negative margin keeps the layout */
    padding-bottom:.05em;
    margin-bottom:-.05em;
  }
  .title-row .y{
    font-weight:500;
    font-size:4.6cqw;
    line-height:1.2;
    color:rgba(var(--ink-rgb),.78);
    white-space:nowrap;
  }
  .stars{
    flex-shrink:0;
    height:4.8cqw;
    font-size:4.8cqw;
    line-height:1;
    letter-spacing:.08em;
    color:var(--star);
    margin-bottom:2cqw;
  }
  .stars .off{color:rgba(var(--ink-rgb),.2);}
  .meta-line{
    flex-shrink:0;
    display:flex;
    gap:2cqw;
    font-size:3.8cqw;
    line-height:1.3;
    height:4.94cqw;
    margin-bottom:.8cqw;
  }
  .meta-line.two{height:9.88cqw;}
  .meta-line .k{
    min-width:22cqw;
    flex-shrink:0;
    font-style:italic;
    color:rgba(var(--ink-rgb),.68);
    font-family:var(--label-font, 'Libre Caslon Text', serif);
  }
  .meta-line .v{
    flex:1;
    min-width:0;
    font-weight:600;
    color:var(--ink);
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta-line.two .v{
    white-space:normal;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .seen{
    margin-top:auto;
    padding-top:1.2cqw;
    border-top:1px dashed rgba(var(--ink-rgb),.3);
    font-family:var(--label-font, 'Libre Caslon Text', serif);
    font-style:italic;
    font-size:3.3cqw;
    line-height:1.3;
    color:rgba(var(--ink-rgb),.68);
    text-align:right;
  }
  .blank{visibility:hidden;}

  /* ---------- card decorations (drawn behind the image and text) ---------- */
  .card{position:relative;--stamp:#a8322a;--cover-line:rgba(255,255,255,.9);}
  .card.dark{--stamp:#f0b8a8;}
  .card > .art, .card > .info, .card > .info-holder{position:relative;z-index:1;}
  .card.has-deco{padding:6.5cqw;}
  .deco{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .deco svg{display:block;width:100%;height:100%;}
  .paper-layer{
    background-image:var(--paper-noise);
    background-size:60cqw 60cqw;
    mix-blend-mode:multiply;
    box-shadow:inset 0 0 6cqw rgba(120,85,40,.16);
  }
  .card.deco-paper{isolation:isolate;}  /* keep the multiply blend inside the card */
  /* postmark-style date */
  .stamp{
    position:absolute;
    right:4cqw;
    bottom:2.5cqw;
    width:25cqw;
    z-index:2;
    color:var(--stamp);
    opacity:.85;
    transform:rotate(-14deg);
    pointer-events:none;
    -webkit-mask-image:var(--ink-mask);
    mask-image:var(--ink-mask);
    -webkit-mask-size:40cqw 40cqw;
    mask-size:40cqw 40cqw;
  }
  .stamp svg{display:block;width:100%;height:auto;overflow:visible;}
  .stamp text{font-family:'Oswald', sans-serif;font-weight:700;fill:currentColor;}

  /* ---------- viewer (horizontal carousel) ---------- */
  .viewer{
    position:fixed;
    inset:0;
    z-index:30;
    background:var(--app-bg);
    color:var(--on-app);
    display:flex;
    flex-direction:column;
  }
  body.has-bg-image .viewer{
    background:linear-gradient(var(--app-scrim), var(--app-scrim)), var(--app-bg-image) center / cover no-repeat;
  }
  .viewer-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 12px 6px;
    position:relative;
    z-index:5;
  }
  .viewer-count{font-size:13px;color:var(--on-app-muted);letter-spacing:.08em;}
  .viewer-actions{display:flex;gap:8px;}
  .shot-preview{text-align:center;margin-bottom:16px;min-height:60px;}
  .shot-preview img{display:none;max-width:100%;max-height:55vh;max-height:55dvh;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .shot-preview img.ready{display:inline-block;}
  .btn:disabled{opacity:.5;}
  .viewer .text-btn{color:var(--on-app);border-color:var(--app-line);}
  .text-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    font-size:13px;
    padding:8px 16px;
    cursor:pointer;
  }
  .carousel-area{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    perspective:1400px;
  }
  .stage{
    position:relative;
    width:min(60vw, 300px, calc((100vh - 220px) / 1.667));
    width:min(60vw, 300px, calc((100dvh - 220px) / 1.667));
    aspect-ratio:3/5;
    transform-style:preserve-3d;
  }
  .slot{
    position:absolute;
    inset:0;
    cursor:pointer;
  }
  .slot .card{box-shadow:0 18px 40px rgba(0,0,0,.5);}
  .slot .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
  .viewer-hint{
    text-align:center;
    color:var(--on-app-muted);
    font-size:12px;
    margin:0;
    padding:4px 0 calc(16px + env(safe-area-inset-bottom));
    position:relative;
    z-index:5;
  }
  .nav-btn{
    display:none;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--border);
    background:rgba(27,27,27,.8);
    color:var(--text);
    font-size:20px;
    cursor:pointer;
    z-index:5;
  }
  .nav-btn.prev{left:20px;}
  .nav-btn.next{right:20px;}
  @media (hover:hover) and (min-width:640px){ .nav-btn{display:block;} }

  /* ---------- bottom sheet (memo) ---------- */
  .backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
  }
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:41;
    max-width:560px;
    margin:0 auto;
    background:var(--panel);
    border-radius:18px 18px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    max-height:88dvh;
    overflow-y:auto;
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:40px;
    height:4px;
    border-radius:2px;
    background:#4a483f;
    margin:0 auto 14px;
  }
  .sheet h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:18px;
    font-weight:900;
    margin:0 0 4px;
    word-break:break-word;
  }
  .sheet .sub{font-size:12px;color:var(--muted);margin:0 0 18px;}
  .date-row{display:flex;gap:8px;}
  .date-row input{flex:1;}
  .date-row .text-btn{flex-shrink:0;border-radius:8px;}
  .sheet textarea{
    width:100%;
    min-height:200px;
    resize:vertical;
    line-height:1.7;
  }
  .sheet-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .save-status{font-size:12px;color:var(--dim);}
  .sheet-foot .btn{width:auto;padding:12px 28px;}
  /* the memo sheet takes the color and decoration of its card */
  #sheet.themed{
    --ink:#17140f;--ink-rgb:23,20,15;
    background:var(--memo-bg);
    color:var(--ink);
    isolation:isolate;
  }
  #sheet.themed.dark{--ink:#f3ece0;--ink-rgb:243,236,224;}
  #sheet.themed.deco-film{padding-left:34px;padding-right:34px;}
  #sheet.themed > :not(.memo-deco){position:relative;z-index:1;}
  #sheet.themed .sheet-handle{background:rgba(var(--ink-rgb),.3);}
  #sheet.themed .sub, #sheet.themed .save-status{color:rgba(var(--ink-rgb),.6);}
  #sheet.themed .field label{color:rgba(var(--ink-rgb),.72);}
  #sheet.themed input, #sheet.themed textarea{
    background:rgba(var(--ink-rgb),.07);
    border-color:rgba(var(--ink-rgb),.25);
    color:var(--ink);
    color-scheme:light;
  }
  #sheet.themed.dark input, #sheet.themed.dark textarea{color-scheme:dark;}
  #sheet.themed input:focus, #sheet.themed textarea:focus{border-color:var(--accent);}
  #sheet.themed textarea::placeholder{color:rgba(var(--ink-rgb),.4);}
  #sheet.themed .text-btn{color:var(--ink);border-color:rgba(var(--ink-rgb),.3);}
  .memo-deco{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .memo-deco::before, .memo-deco::after{content:'';position:absolute;}
  .memo-deco[data-deco="frame-round"]::before,
  .memo-deco[data-deco="frame-cut"]::before{inset:8px;border:1.4px solid rgba(255,255,255,.9);border-radius:12px 12px 4px 4px;}
  .memo-deco[data-deco="frame-cut"]::before{border-radius:0;}
  .memo-deco[data-deco="arabesque"]::before{inset:10px;border:1px solid rgba(var(--ink-rgb),.55);}
  .memo-deco[data-deco="cover"]::before{inset:8px;border:.9px solid rgba(255,255,255,.9);}
  .memo-deco[data-deco="cover"]::after{inset:13px;border:.7px solid rgba(255,255,255,.9);}
  .memo-deco[data-deco="film"]::before,
  .memo-deco[data-deco="film"]::after{
    top:0;bottom:0;width:18px;
    background:#111 linear-gradient(#efe9df 0 9px, transparent 9px) 5px 6px / 8px 16px repeat-y;
  }
  .memo-deco[data-deco="film"]::before{left:0;}
  .memo-deco[data-deco="film"]::after{right:0;}
  .memo-deco[data-deco="paper"]{
    background-image:var(--paper-noise);
    background-size:400px 400px;
    mix-blend-mode:multiply;
    box-shadow:inset 0 0 40px rgba(120,85,40,.16);
  }
  .memo-deco .orn{position:absolute;left:50%;width:84px;height:24px;overflow:visible;}
  .memo-deco .orn.top{top:-2px;transform:translateX(-50%);}
  .memo-deco .orn.bottom{bottom:-2px;transform:translateX(-50%) rotate(180deg);}

  /* ---------- editor ---------- */
  .editor{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--app-bg);
    color:var(--on-app);
    display:flex;
    flex-direction:column;
  }
  /* the editor shares the album background (color or photo); the form panel stays dark */
  body.has-bg-image .editor{
    background:linear-gradient(var(--app-scrim), var(--app-scrim)), var(--app-bg-image) center / cover no-repeat;
  }
  .editor-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom:1px solid var(--app-line);
  }
  .editor-top .text-btn, .img-actions .text-btn{color:var(--on-app);border-color:var(--app-line);}
  .editor-top h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    font-weight:900;
    margin:0;
  }
  .editor-top .text-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .editor-body{
    flex:1;
    overflow-y:auto;
    padding:20px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .editor-inner{max-width:440px;margin:0 auto;}
  .preview-card{width:min(100%, 320px);margin:0 auto 8px;}
  .preview-card .card{box-shadow:0 14px 40px rgba(0,0,0,.5);}
  .preview-card .art.has-photo{cursor:grab;touch-action:none;}
  .preview-card .art.has-photo.dragging{cursor:grabbing;}
  .preview-card .art.empty::after{content:'画像をタップして選択';letter-spacing:0;}
  .preview-card .art.empty{cursor:pointer;}
  .crop-hint{
    font-size:11px;
    color:var(--on-app-muted);
    text-align:center;
    margin:0 0 6px;
  }
  .zoom-row{display:flex;align-items:center;gap:8px;max-width:320px;margin:0 auto;}
  .zoom-icon{font-size:13px;color:var(--on-app-muted);width:14px;text-align:center;}
  .zoom-row input{flex:1;accent-color:var(--accent);}
  .img-actions{display:flex;justify-content:center;gap:8px;margin:10px 0 0;}

  .form{
    color:var(--text);
    background:var(--panel);
    border-radius:14px;
    padding:22px 18px 24px;
    margin-top:20px;
  }
  .seg{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--panel-2);
    border-radius:10px;
    padding:4px;
    margin-bottom:20px;
  }
  .seg button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:#fff;}

  .field{margin-bottom:16px;}
  .field label, .field .label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:#c7bfae;
    margin-bottom:6px;
  }
  .req{color:var(--accent);margin-left:4px;}
  .opt{font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:0;margin-left:6px;}
  input[type="text"], input[type="date"], textarea, select{
    width:100%;
    padding:11px 12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:#f2eee4;
    border-radius:8px;
    font-family:inherit;
    font-size:16px;
    outline:none;
    color-scheme:dark;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23c7bfae'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .err-msg{display:none;font-size:12px;color:#e0826b;margin-top:6px;}
  .field.invalid input{border-color:#e0826b;}
  .field.invalid .err-msg{display:block;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:#c7bfae;
    border-radius:999px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  #genreOtherWrap{margin-top:10px;}

  .star-input{display:flex;gap:4px;}
  .star-input button{
    background:none;
    border:none;
    font-size:32px;
    line-height:1;
    color:#4a483f;
    padding:2px;
    cursor:pointer;
  }
  .star-input button.on{color:var(--star);}

  .editor[data-type="movie"] .novel-only,
  .editor[data-type="novel"] .movie-only{display:none;}

  .divider{height:1px;background:#33322c;margin:22px 0;}
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .seg.small{margin-bottom:12px;}
  .seg.small button{padding:8px;font-size:13px;}
  .swatch{
    width:100%;
    aspect-ratio:1/1;
    border-radius:8px;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .swatch.selected{border-color:var(--accent);}
  .swatch.custom{
    display:flex;
    align-items:center;
    justify-content:center;
    background:repeating-conic-gradient(#3a3833 0% 25%, #2a2925 0% 50%) 50% / 8px 8px;
    overflow:hidden;
  }
  .swatch.custom input{opacity:0;width:100%;height:100%;cursor:pointer;}
  .swatch.custom::after{content:'+';position:absolute;color:#efe9df;font-size:14px;pointer-events:none;}

  .btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .btn:active{transform:scale(.98);}
  .btn.danger{background:transparent;border:1px solid #6b3426;color:#e0826b;margin-top:24px;}

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:#efe9df;
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:100;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="topbar">

<!-- viewer -->

<!-- memo sheet -->
<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-hidden="true">

<!-- save card as image -->

<!-- background color sheet -->
<section class="sheet" id="bgSheet" aria-hidden="true">
  <div class="sheet-handle"></div>

<!-- editor -->
<div class="editor" id="editor" data-type="movie" hidden>
  <div class="editor-top">
    <button class="text-btn" id="editorCancel">キャンセル</button>
    <h2 id="editorTitle">新しいカード</h2>
    <button class="text-btn primary" id="editorSave">保存</button>
  </div>
  <div class="editor-body" id="editorBody">
    <div class="editor-inner">
      <div class="preview-card card-wrap">
        <article class="card" id="pvCard">
          <div id="pvDeco"></div>

      <div class="img-actions">

        <button class="text-btn" id="removeImgBtn" hidden>画像を外す</button>
      </div>
      <input type="file" id="imgInput" accept="image/*" hidden>

      <div class="form">
        <div class="seg" id="typeSeg">
          <button data-type="movie" class="active">🎞️ 映画</button>
          <button data-type="novel">📖 小説</button>
        </div>

        <div class="field" data-field="title">
          <label for="fTitle">タイトル<span class="req">*</span></label>

        <div class="field movie-only" data-field="director">

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// each choice = a Latin face first, then a Japanese face for the characters the Latin one lacks
const FONTS = {
  anton:     ["'Anton', 'Dela Gothic One', sans-serif", 'Anton + Dela Gothic One（極太ポスター）'],
  archivo:   ["'Archivo Black', 'Zen Kaku Gothic New', sans-serif", 'Archivo Black + Zen角ゴシック（力強いゴシック）'],
  bebas:     ["'Bebas Neue', 'RocknRoll One', sans-serif", 'Bebas Neue + RocknRoll One（コンデンス・ポップ）'],
  oswald:    ["'Oswald', 'Zen Kaku Gothic New', sans-serif", 'Oswald + Zen角ゴシック（すっきり）'],
  zen:       ["'Zen Kaku Gothic New', sans-serif", 'Zen角ゴシック New（和文ゴシック）'],
  mincho:    ["'Libre Caslon Text', 'Shippori Mincho', serif", 'Libre Caslon + Shippori明朝（上品な明朝）'],
  oldmincho: ["'Playfair Display', 'Zen Old Mincho', serif", 'Playfair + Zen Old明朝（クラシック）'],
  antique:   ["'Zen Antique', serif", 'Zen Antique（レトロ）'],
  maru:      ["'Zen Maru Gothic', sans-serif", 'Zen丸ゴシック（やわらか）'],
  klee:      ["'Klee One', cursive", 'Klee One（手書き風）'],
  yusei:     ["'Yusei Magic', sans-serif", 'Yusei Magic（マーカー風）'],
  pop:       ["'Mochiy Pop One', sans-serif", 'Mochiy Pop One（ポップ）'],
  dot:       ["'DotGothic16', sans-serif", 'DotGothic16（ドット風）'],
};
const DEFAULT_COLOR = '#c9c6bf';
// earlier, lighter palette → current deeper palette (for cards saved before the change)
const OLD_COLORS = {
  '#efe9df':'#e0cfb1', '#e3e1dc':'#c9c6bf', '#d7dede':'#a9bfc4', '#dcdfd4':'#b5c0a3',
  '#e2d9d6':'#d3b2aa', '#dcd6df':'#b9aec6', '#d9d2c4':'#cdb995', '#cfcfcf':'#a8a8a8',
};

/* ---------- storage (IndexedDB) ---------- */
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('card-album', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cards', {keyPath:'id'});
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(){
    return new Promise((res, rej) => {
      const r = this.db.transaction('cards').objectStore('cards').getAll();
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  write(fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction('cards', 'readwrite');
      fn(t.objectStore('cards'));
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },
  put(card){ return this.write(s => s.put(card)); },
  putMany(list){ return this.write(s => list.forEach(c => s.put(c))); },
  del(id){ return this.write(s => s.delete(id)); },
};

let cards = [];
let filter = 'all';

let query = '';
let sortBy = 'seen';
try{ sortBy = localStorage.getItem('card-album-sort') || 'seen'; }catch(err){}

// for search: full-width → half-width, lower case, katakana → hiragana
function normalize(s){
  return String(s || '').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function haystack(c){
  return normalize([c.title, c.director, c.author, c.translator, c.genre, (c.cast || []).join(' '),
    c.studio, c.year, c.memo].join(' '));
}
// newest viewing date first; cards without a date go after, newest added first
function bySeen(a, b){
  if((a.date || '') !== (b.date || '')) return (b.date || '').localeCompare(a.date || '');
  return b.createdAt - a.createdAt;
}
const SORTS = {
  seen: bySeen,
  created: (a, b) => b.createdAt - a.createdAt,
  rating: (a, b) => (b.rating || 0) - (a.rating || 0) || bySeen(a, b),
  title: (a, b) => normalize(a.title).localeCompare(normalize(b.title), 'ja'),
};
function visibleCards(){
  const words = normalize(query).split(/\s+/).filter(Boolean);  // every word must match
  return cards
    .filter(c => filter === 'all' || c.type === filter)
    .filter(c => !words.length || (h => words.every(w => h.includes(w)))(haystack(c)))
    .sort(SORTS[sortBy] || bySeen);
}
function findCard(id){ return cards.find(c => c.id === id); }

/* ---------- layers & back button ---------- */
// Each overlay (viewer / sheet / editor) pushes a history entry so the
// phone's back button closes the top one.
const layers = [];
history.replaceState({depth:0}, '');
function pushLayer(close){
  layers.push(close);
  history.pushState({depth:layers.length}, '');
  document.body.classList.add('locked');
}
function closeLayers(n = 1){ history.go(-n); }
window.addEventListener('popstate', e => {
  const depth = (e.state && e.state.depth) || 0;
  while(layers.length > depth) layers.pop()();
  document.body.classList.toggle('locked', layers.length > 0);
});

/* ---------- card rendering ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
// an empty item still takes its row, so every card has the same layout
function metaLine(k, v, cls = ''){
  return `<div class="meta-line ${cls}${v ? '' : ' blank'}"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`;
}
// font for the small labels ("directed by", "watched …"): [font-family, font-style, menu label]
// labels are always italic; [font, display name]
const LABEL_FONTS = {
  caslon:   ["'Libre Caslon Text', serif", 'Libre Caslon'],
  playfair: ["'Playfair Display', serif", 'Playfair'],
  oswald:   ["'Oswald', sans-serif", 'Oswald（すっきり）'],
  bebas:    ["'Bebas Neue', sans-serif", 'Bebas Neue（コンデンス）'],
  same:     [null, 'カードの書体と同じ'],
};
function labelFontOf(c){

  return [lf[0] || (FONTS[c.titleFont] || FONTS.anton)[0]];

/* ---------- card decorations ---------- */
// All drawings use a 300×500 box (the card's 3:5 shape) and sit behind the image and text.
const DECOS = [
  ['none', 'なし'],
  ['frame-round', '白枠・抉れ角'],
  ['frame-cut', '白枠・45度'],
  ['arabesque', '唐草'],
  ['paper', '古紙'],
  ['film', 'フィルム', 'movie'],
  ['cover', 'カバー下', 'novel'],
];
const svgBox = inner => `<svg viewBox="0 0 300 500" preserveAspectRatio="none" fill="none">${inner}</svg>`;

function frameRoundSVG(){
  // corners scooped inward (circle centred on each corner)
  const d = 7, r = 12, W = 300, H = 500;
  const p = `M${d + r} ${d} H${W - d - r} A${r} ${r} 0 0 0 ${W - d} ${d + r} V${H - d - r}` +
    ` A${r} ${r} 0 0 0 ${W - d - r} ${H - d} H${d + r} A${r} ${r} 0 0 0 ${d} ${H - d - r}` +
    ` V${d + r} A${r} ${r} 0 0 0 ${d + r} ${d} Z`;
  return svgBox(`<path d="${p}" stroke="rgba(255,255,255,.9)" stroke-width="1.4"/>`);
}
function frameCutSVG(){
  const d = 7, c = 11, W = 300, H = 500;
  const pts = [[d + c, d], [W - d - c, d], [W - d, d + c], [W - d, H - d - c], [W - d - c, H - d], [d + c, H - d], [d, H - d - c], [d, d + c]];
  return svgBox(`<polygon points="${pts.map(p => p.join(',')).join(' ')}" stroke="rgba(255,255,255,.9)" stroke-width="1.4"/>`);
}
// one simple scroll, mirrored (centred on 0,0); a patch of card color hides the border line behind it
const ARABESQUE_HALF = '<path d="M4 0 C9 -6 16 -6 20 -1 C24 4 31 5 35 0 C38 -4 35 -8 31 -6 C28 -4 30 -1 33 -1"/>' +
  '<path d="M12 -4 C11 -9 16 -11 18 -8"/><path d="M25 3 C25 8 30 9 31 6"/>';
const ARABESQUE_ORN = `<rect x="-40" y="-11" width="80" height="22" style="fill:var(--card-bg)" stroke="none"/>` +
  `${ARABESQUE_HALF}<g transform="scale(-1,1)">${ARABESQUE_HALF}</g><path d="M0 -6 C3 -2 3 2 0 6 C-3 2 -3 -2 0 -6Z"/>`;
function arabesqueSVG(){
  // the ornament placed on the middle of each side
  const orn = ARABESQUE_ORN;
  const place = ['translate(150,9) scale(.8)', 'translate(291,250) rotate(90) scale(.8)',
    'translate(150,491) rotate(180) scale(.8)', 'translate(9,250) rotate(-90) scale(.8)'];
  return svgBox(`<g style="stroke:rgba(var(--ink-rgb),.55)" stroke-width="1" stroke-linecap="round">
    <rect x="9" y="9" width="282" height="482"/>${place.map(t => `<g transform="${t}">${orn}</g>`).join('')}</g>`);
}
function filmSVG(){
  // sprocket strips down both sides
  let holes = '';
  for(let y = 6; y < 494; y += 16){
    holes += `<rect x="5" y="${y}" width="8" height="9" rx="1.5"/><rect x="287" y="${y}" width="8" height="9" rx="1.5"/>`;
  }
  return svgBox(`<rect x="0" y="0" width="18" height="500" fill="#111"/><rect x="282" y="0" width="18" height="500" fill="#111"/>
    <g fill="#efe9df">${holes}</g>`);
}
function coverSVG(){
  // a twisted cord around the edge (two strands crossing) and a thin inner rule, like a bunko cover
  const inset = 8, A = 3, period = 14, W = 300, H = 500;
  const corners = [[inset, inset], [W - inset, inset], [W - inset, H - inset], [inset, H - inset]];
  const strand = sign => {
    let d = `M${inset} ${inset}`;
    corners.forEach((p, i) => {
      const q = corners[(i + 1) % 4];
      const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const n = Math.round(len / period) * 2;  // half-waves
      const ux = (q[0] - p[0]) / len, uy = (q[1] - p[1]) / len;
      const nx = -uy, ny = ux, step = len / n;
      for(let k = 0; k < n; k++){
        const s = sign * (k % 2 ? -1 : 1) * 2 * A;  // quadratic peak is half the control offset
        const mx = p[0] + ux * step * (k + .5) + nx * s, my = p[1] + uy * step * (k + .5) + ny * s;
        const ex = p[0] + ux * step * (k + 1), ey = p[1] + uy * step * (k + 1);
        d += ` Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
      }
    });
    return `<path d="${d}"/>`;
  };
  return svgBox(`<g style="stroke:var(--cover-line)" stroke-width=".9">${strand(1)}${strand(-1)}
    <rect x="15" y="15" width="270" height="470" stroke-width=".7"/></g>`);
}
const DECO_SVG = {
  'frame-round': frameRoundSVG(),
  'frame-cut': frameCutSVG(),
  'arabesque': arabesqueSVG(),
  'film': filmSVG(),
  'cover': coverSVG(),
};

// film is only for movies, cover only for novels
function decoOf(c){
  const d = c.deco || 'none';
  const def = DECOS.find(x => x[0] === d);
  if(!def || (def[2] && def[2] !== c.type)) return 'none';
  return d;
}
function decoHTML(deco){
  if(deco === 'none') return '';
  if(deco === 'paper') return '<div class="deco paper-layer"></div>';
  return `<div class="deco">${DECO_SVG[deco]}</div>`;
}

// chipped edges for the old-paper look: a seeded random outline, so each card
// gets its own chips and keeps them every time it is drawn
function seededRandom(str){
  let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => {
    h = Math.imul(h ^ h >>> 16, 2246822507);
    h = Math.imul(h ^ h >>> 13, 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function chipClip(id){
  const rnd = seededRandom(String(id));
  const ky = 0.6;  // the card is 5/3 as tall as wide, so vertical % are smaller
  const sides = [[], [], [], []];
  const count = 4 + Math.floor(rnd() * 3);
  for(let i = 0; i < count; i++){
    sides[Math.floor(rnd() * 4)].push({t:0.08 + rnd() * 0.84, len:2 + rnd() * 4, depth:0.6 + rnd() * 1.1});
  }
  const cut = () => rnd() < 0.35 ? 0.8 + rnd() * 1.2 : 0;  // occasionally a nicked corner
  const cuts = [cut(), cut(), cut(), cut()];
  const pts = [];
  // each side: start corner, direction along the edge, inward normal (all in %)
  const edges = [
    {o:[0, 0],     u:[1, 0],  n:[0, 1]},
    {o:[100, 0],   u:[0, 1],  n:[-1, 0]},
    {o:[100, 100], u:[-1, 0], n:[0, -1]},
    {o:[0, 100],   u:[0, -1], n:[1, 0]},
  ];
  edges.forEach((e, i) => {
    const scale = e.u[0] ? 1 : ky;  // inward depth measured across the edge
    const cIn = cuts[i];
    const at = (s, depth) => [e.o[0] + e.u[0] * s + e.n[0] * depth * (e.n[0] ? 1 : ky),
                              e.o[1] + e.u[1] * s + e.n[1] * depth * (e.n[1] ? 1 : ky)];
    if(cIn){ pts.push(at(0, cIn)); pts.push(at(cIn * scale * 0.8, 0)); }
    else pts.push(at(0, 0));
    sides[i].sort((a, b) => a.t - b.t).forEach(ch => {
      const s = ch.t * 100, L = ch.len * scale;
      pts.push(at(s - L / 2, 0), at(s - L * 0.2, ch.depth * 0.8), at(s + L * 0.15, ch.depth), at(s + L / 2, 0));
    });
  });
  return `polygon(${pts.map(p => `${p[0].toFixed(2)}% ${p[1].toFixed(2)}%`).join(',')})`;
}

/* ---------- viewer (horizontal carousel) ---------- */
// Cards sit side by side; dragging rolls the row. The front card is flat,
// cards to the sides turn inward and sink back a little.
const viewer = $('viewer'), stage = $('stage'), carouselArea = $('carouselArea');
let viewerList = [];
let pos = 0;          // which card is in front (fractional while moving)
let ring = null;      // {n, loop, w, unit, els, shades}
let anim = null;      // requestAnimationFrame id

const LOOP_MIN = 5;   // with this many cards or more the row wraps around endlessly
const SIDE_MAX = 3.5; // cards further than this from the front are not drawn
function mod(a, n){ return ((a % n) + n) % n; }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function currentIndex(){ return viewerList.length ? mod(Math.round(pos), viewerList.length) : 0; }
// signed distance of card i from the front
function dist(i){ return ring.loop ? mod(i - pos + ring.n / 2, ring.n) - ring.n / 2 : i - pos; }

function buildRing(){
  const n = viewerList.length;
  if(!n){ stage.innerHTML = ''; ring = null; $('viewerCount').textContent = ''; return; }
  stage.innerHTML = viewerList.map(c => `<div class="slot">${cardHTML(c)}<div class="shade"></div></div>`).join('');
  const w = stage.clientWidth;
  const els = [...stage.querySelectorAll('.slot')];
  ring = {n, loop:n >= LOOP_MIN, w, unit:w * 0.62, els, shades:els.map(el => el.querySelector('.shade'))};
  layout();
}
function layout(){
  if(!ring) return;
  const {n, loop, w, unit, els, shades} = ring;
  els.forEach((el, i) => {
    const d = dist(i);
    // fade out at the far ends (and where a looping row wraps around)
    const edge = loop ? Math.min(n / 2, SIDE_MAX) : SIDE_MAX;
    const opacity = clamp((edge - Math.abs(d)) * 2, 0, 1);
    if(opacity <= 0){ el.style.visibility = 'hidden'; return; }
    el.style.visibility = '';
    el.style.opacity = opacity;
    el.style.transform = `translateX(${d * unit}px) translateZ(${-Math.abs(d) * w * 0.35}px) rotateY(${-clamp(d, -1, 1) * 28}deg)`;
    shades[i].style.opacity = Math.min(Math.abs(d), 3) * 0.17;
  });
  $('viewerCount').textContent = `${currentIndex() + 1} / ${n}`;
}
function stopAnim(){ if(anim){ cancelAnimationFrame(anim); anim = null; } }
function spinTo(target){
  stopAnim();
  if(ring && !ring.loop) target = clamp(target, 0, ring.n - 1);
  const from = pos, delta = target - from;
  const dur = 380 + 70 * Math.min(Math.abs(delta), 5);
  const t0 = performance.now();
  const tick = now => {
    const t = Math.min((now - t0) / dur, 1);
    pos = from + delta * (1 - Math.pow(1 - t, 3));
    layout();
    if(t < 1){ anim = requestAnimationFrame(tick); }
    else{ anim = null; pos = ring ? mod(target, ring.n) : 0; layout(); }
  };
  anim = requestAnimationFrame(tick);
}
function go(step){ if(ring && ring.n > 1) spinTo(Math.round(pos) + step); }

function openViewer(index){
  viewerList = visibleCards();
  pos = index;
  viewer.hidden = false;
  buildRing();
  pushLayer(() => { stopAnim(); viewer.hidden = true; stage.innerHTML = ''; ring = null; });
}
function refreshViewer(keepId){
  if(viewer.hidden) return;
  const cur = currentIndex();
  viewerList = visibleCards();
  const i = viewerList.findIndex(c => c.id === keepId);
  stopAnim();
  pos = i >= 0 ? i : Math.min(cur, Math.max(viewerList.length - 1, 0));
  buildRing();
}
window.addEventListener('resize', () => { if(!viewer.hidden) buildRing(); });

// drag to roll the row; a flick keeps it going for a few cards
let spinDrag = null;
carouselArea.addEventListener('pointerdown', e => {
  if(!ring) return;
  stopAnim();
  const now = performance.now();
  spinDrag = {x:e.clientX, y:e.clientY, axis:null, dy:0, startPos:pos, moved:false, slot:e.target.closest('.slot'),
              lastX:e.clientX, lastT:now, prevX:e.clientX, prevT:now};
  carouselArea.setPointerCapture(e.pointerId);
});
carouselArea.addEventListener('pointermove', e => {
  if(!spinDrag) return;
  const d = spinDrag, dx = e.clientX - d.x, dy = e.clientY - d.y;
  d.prevX = d.lastX; d.prevT = d.lastT;
  d.lastX = e.clientX; d.lastT = performance.now();
  if(!d.axis){
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 6) return;
    d.axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
  }
  if(d.axis === 'y'){
    // swipe up: the row lifts a little with the finger, then the memo opens on release
    d.moved = true;
    d.dy = dy;
    stage.style.translate = `0 ${Math.max(-40, Math.min(0, dy * .35))}px`;
    return;
  }
  if(ring.n < 2) return;
  d.moved = true;
  pos = d.startPos - dx / ring.unit;
  if(!ring.loop) pos = clamp(pos, -0.35, ring.n - 0.65);  // a little give at both ends
  layout();
});
function endSpin(cancelled){
  if(!spinDrag) return;
  const d = spinDrag;
  spinDrag = null;
  if(d.axis === 'y'){
    stage.style.translate = '';
    const c = viewerList[currentIndex()];
    if(!cancelled && d.dy < -40 && c) openSheet(c.id);
  }else if(d.moved){
    const v = cancelled ? 0 : (d.lastX - d.prevX) / Math.max(d.lastT - d.prevT, 1);  // px per ms
    const extra = Math.max(-6, Math.min(6, -v * 300 / ring.unit));
    spinTo(Math.round(pos + extra));
  }else if(!cancelled && d.slot){
    const i = ring.els.indexOf(d.slot);
    const off = dist(i);
    if(Math.abs(off) >= 0.5) spinTo(pos + off);  // side card: bring it to the front
  }else{
    spinTo(Math.round(pos));
  }
}
carouselArea.addEventListener('pointerup', () => endSpin(false));
carouselArea.addEventListener('pointercancel', () => endSpin(true));

$('prevBtn').addEventListener('click', () => go(-1));
$('nextBtn').addEventListener('click', () => go(1));
$('viewerClose').addEventListener('click', () => closeLayers());
$('viewerEdit').addEventListener('click', () => {
  const c = viewerList[currentIndex()];
  if(c){ stopAnim(); openEditor(c); }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('input, textarea, select')) return;
  if(e.key === 'Escape' && layers.length) closeLayers();

  }
});

// The card is rendered off screen and turned into a PNG with html-to-image. Only the

const shotSheet = $('shotSheet'), shotImg = $('shotImg'), shotSub = $('shotSub'), shotSave = $('shotSave');

const FONT_SPECS = new URL(document.querySelector('link[href*="fonts.googleapis.com/css2"]').href)

function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });

async function fontCSSFor(c, el){
  const families = new Set([...((FONTS[c.titleFont] || FONTS.anton)[0]).matchAll(/'([^']+)'/g)].map(m => m[1]));
  [...labelFontOf(c)[0].matchAll(/'([^']+)'/g)].forEach(m => families.add(m[1]));  // labels
  ['Oswald', 'Noto Sans JP'].forEach(n => families.add(n));  // postmark, fallback
  const text = [...new Set(el.textContent.replace(/\s/g, '') + 'NOIMAGE')].join('');
  let css = '';
  for(const name of families){
    const spec = FONT_SPECS.find(s => s.split(':')[0] === name);
    if(!spec) continue;
    const u = new URL('https://fonts.googleapis.com/css2');
    u.searchParams.append('family', spec);
    u.searchParams.set('text', text);
    let part = await (await fetch(u)).text();
    for(const m of [...part.matchAll(/url\((https:[^)]+)\)/g)]){
      part = part.replace(m[1], await blobToDataURL(await (await fetch(m[1])).blob()));
    }
    css += part;
  }
  return css;
}
// withBg: the card sits on the current app background (color or photo) with a margin around it
async function cardImage(c, withBg){
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;';
  holder.innerHTML = `<div><div style="width:600px">${cardHTML(c)}</div></div>`;
  const frame = holder.firstElementChild;
  if(withBg){
    const root = document.documentElement.style;
    frame.style.cssText = `padding:90px 80px;background:${root.getPropertyValue('--app-bg') || '#0f0e0c'}`;
    const photo = root.getPropertyValue('--app-bg-image');
    if(photo) Object.assign(frame.style, {backgroundImage:photo, backgroundSize:'cover', backgroundPosition:'center'});
  }
  document.body.appendChild(holder);
  const el = holder.querySelector('.card');
  if(withBg) el.style.boxShadow = '0 14px 36px rgba(0,0,0,.4)';
  const target = withBg ? frame : el;
  try{
    await document.fonts.ready;
    let fontEmbedCSS = '';
    try{ fontEmbedCSS = await fontCSSFor(c, el); }catch(err){ console.warn(err); }
    const opts = Object.assign({pixelRatio:2}, fontEmbedCSS ? {fontEmbedCSS} : {skipFonts:true});
    await htmlToImage.toPng(target, opts);  // first pass lets Safari finish loading images/fonts
    return await htmlToImage.toPng(target, opts);
  }finally{
    holder.remove();
  }
}

const imgInput = $('imgInput'), zoomRange = $('zoomRange');
const img = {el:null, natW:0, natH:0, zoom:1, offX:0, offY:0, dirty:false, src:''};

function clearImage(){
  Object.assign(img, {el:null, natW:0, natH:0, zoom:1, offX:0, offY:0, dirty:false, src:''});
  pvArt.style.backgroundImage = '';
  pvArt.style.backgroundSize = '';
  pvArt.style.backgroundPosition = '';
  pvArt.classList.add('empty');
  pvArt.classList.remove('has-photo');
  $('cropControls').hidden = true;
  $('removeImgBtn').hidden = true;
  zoomRange.value = 100;
}
function loadImage(src, isNew){
  const el = new Image();
  el.onload = () => {
    Object.assign(img, {el, natW:el.naturalWidth, natH:el.naturalHeight, zoom:1, dirty:isNew, src});
    zoomRange.value = 100;
    pvArt.style.backgroundImage = `url(${src})`;
    pvArt.classList.remove('empty');
    pvArt.classList.add('has-photo');
    $('cropControls').hidden = false;
    $('removeImgBtn').hidden = false;
    const cw = pvArt.clientWidth;
    const cover = Math.max(cw / img.natW, cw / img.natH);
    img.offX = (cw - img.natW * cover) / 2;
    img.offY = (cw - img.natH * cover) / 2;
    applyBackground();
  };
  el.src = src;
}
function applyBackground(){
  if(!img.natW) return;
  const cw = pvArt.clientWidth;
  const scale = Math.max(cw / img.natW, cw / img.natH) * img.zoom;
  const bgW = img.natW * scale, bgH = img.natH * scale;
  img.offX = Math.min(0, Math.max(cw - bgW, img.offX));
  img.offY = Math.min(0, Math.max(cw - bgH, img.offY));
  pvArt.style.backgroundSize = `${bgW}px ${bgH}px`;
  pvArt.style.backgroundPosition = `${img.offX}px ${img.offY}px`;
}
function croppedImage(){
  // render the visible square to a compact JPEG so storage stays small
  const cw = pvArt.clientWidth;
  const scale = Math.max(cw / img.natW, cw / img.natH) * img.zoom;
  const size = 800;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  canvas.getContext('2d').drawImage(img.el, -img.offX / scale, -img.offY / scale, cw / scale, cw / scale, 0, 0, size, size);
  return canvas.toDataURL('image/jpeg', 0.85);
}

  img.dirty = true;

});
let drag = null;
pvArt.addEventListener('pointerdown', e => {
  if(!img.natW) return;
  drag = {x:e.clientX, y:e.clientY, offX:img.offX, offY:img.offY};
  pvArt.setPointerCapture(e.pointerId);

});
pvArt.addEventListener('pointermove', e => {
  if(!drag) return;
  img.offX = drag.offX + (e.clientX - drag.x);
  img.offY = drag.offY + (e.clientY - drag.y);
  img.dirty = true;
  applyBackground();
});
['pointerup', 'pointercancel'].forEach(t => pvArt.addEventListener(t, () => {

function validate(d){
  const bad = [];
  if(!d.title) bad.push('title');
  if(d.type === 'movie' && !d.director) bad.push('director');
  if(d.type === 'novel' && !d.author) bad.push('author');
  if(!/^\d{1,4}$/.test(d.year)) bad.push('year');
  if(!d.rating) bad.push('rating');
  document.querySelectorAll('.field[data-field]').forEach(el =>
    el.classList.toggle('invalid', bad.includes(el.dataset.field)));
  if(bad.length){
    editor.querySelector(`.field[data-field="${bad[0]}"]`).scrollIntoView({behavior:'smooth', block:'center'});
  }
  return bad.length === 0;
}

$('editorSave').addEventListener('click', async () => {
  const d = collect();
  if(!validate(d)) return;
  const old = editingId ? findCard(editingId) : null;
  // keep only the fields that belong to the chosen type
  if(d.type === 'movie'){ d.author = ''; d.translator = ''; }
  else{ d.director = ''; d.cast = []; d.studio = ''; }
  d.deco = decoOf(d);  // e.g. film chosen, then switched to a novel
  const card = Object.assign({
    id: old ? old.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
    createdAt: old ? old.createdAt : Date.now(),
    date: old ? old.date : '',
    memo: old ? old.memo : '',
  }, d, {
    image: !img.natW ? '' : (img.dirty ? croppedImage() : img.src),
    updatedAt: Date.now(),
  });
  try{
    await DB.put(card);
  }catch(err){
    console.error(err);
    toast('保存に失敗しました');
    return;
  }
  if(old) Object.assign(old, card); else cards.push(card);
  renderGrid();
  refreshViewer(card.id);
  closeLayers();
  toast(old ? '更新しました' : 'カードを追加しました');
});
$('editorCancel').addEventListener('click', () => closeLayers());
$('deleteBtn').addEventListener('click', async () => {
  const c = findCard(editingId);
  if(!c || !confirm(`「${c.title}」を削除しますか？\nメモ・感想も消えます。`)) return;
  await DB.del(c.id);
  cards = cards.filter(x => x.id !== c.id);
  renderGrid();
  if(!viewer.hidden && visibleCards().length === 0){
    closeLayers(2);  // editor + viewer
  }else{
    refreshViewer(null);
    closeLayers();
  }
  toast('削除しました');
});

/* ---------- background color ---------- */
// a per-device preference, so it lives in localStorage rather than with the cards
// dark → mid → light
const BG_COLORS = [
  ['#0f0e0c', '墨'], ['#2b2b2b', 'チャコール'], ['#1e2429', 'スレート'], ['#121a2b', '濃紺'],
  ['#0f2a2c', '深い青緑'], ['#13221c', '深緑'], ['#23251a', 'オリーブ'], ['#2a1f17', 'こげ茶'],
  ['#2a1216', 'ボルドー'], ['#1f1626', '深い紫'],
  ['#6f8796', 'ダスティブルー'], ['#8d9a83', 'セージ'], ['#c4a35a', 'マスタード'], ['#b68f8f', 'ローズ'],
  ['#f3eee4', '生成り'], ['#f4ecd2', 'クリーム'], ['#e6dccb', 'サンド'], ['#e6e6e3', '薄いグレー'],
  ['#dbe6ea', '淡い水色'], ['#dfe9df', 'ミント'], ['#e4dfec', 'ラベンダー'], ['#ecdcd8', 'くすみピンク'],
];
const BG_KEY = 'card-album-bg';
const bgSheet = $('bgSheet'), bgSwatches = $('bgSwatches');
bgSwatches.innerHTML = BG_COLORS.map(([c, name]) =>
  `<button class="swatch" data-color="${c}" style="background:${c}" title="${name}"></button>`).join('') +
  '<label class="swatch custom" title="カスタムカラー"><input type="color" id="bgCustom"></label>';

function isLight(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex || '')) return true;
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 > 0.55;
}
function applyBg(hex){
  const light = isLight(hex), s = document.documentElement.style;
  s.setProperty('--app-bg', hex);
  s.setProperty('--on-app', light ? '#17140f' : '#efe9df');
  s.setProperty('--on-app-muted', light ? 'rgba(23,20,15,.55)' : '#7d766a');
  s.setProperty('--app-line', light ? 'rgba(23,20,15,.14)' : 'rgba(255,255,255,.08)');
  // veil over a photo background so the text on it stays readable
  s.setProperty('--app-scrim', light ? 'rgba(255,255,255,.3)' : 'rgba(0,0,0,.35)');
  document.querySelector('meta[name="theme-color"]').content = hex;
  const photo = document.body.classList.contains('has-bg-image');
  bgSwatches.querySelectorAll('.swatch[data-color]').forEach(sw => sw.classList.toggle('selected', !photo && sw.dataset.color === hex));
  $('bgCustom').value = hex;
}
function setBg(hex){
  applyBgImage(null);
  try{ localStorage.removeItem(BG_IMG_KEY); }catch(err){}
  applyBg(hex);
  try{ localStorage.setItem(BG_KEY, hex); }catch(err){}
}

// photo background: shrunk to a JPEG and kept on this device; its average color sets the text tone
const BG_IMG_KEY = 'card-album-bg-image';
function applyBgImage(photo){
  const s = document.documentElement.style;
  if(photo){
    s.setProperty('--app-bg-image', `url("${photo.img}")`);
    document.body.classList.add('has-bg-image');
    applyBg(photo.avg);
  }else{
    s.removeProperty('--app-bg-image');
    document.body.classList.remove('has-bg-image');
  }
  $('bgImgRemove').hidden = !photo;
}
function averageColor(el){
  const c = document.createElement('canvas');
  c.width = c.height = 8;
  const ctx = c.getContext('2d');
  ctx.drawImage(el, 0, 0, 8, 8);
  const px = ctx.getImageData(0, 0, 8, 8).data;
  let r = 0, g = 0, b = 0;
  for(let i = 0; i < px.length; i += 4){ r += px[i]; g += px[i + 1]; b += px[i + 2]; }
  const n = px.length / 4, hex = v => Math.round(v / n).toString(16).padStart(2, '0');
  return `#${hex(r)}${hex(g)}${hex(b)}`;
}
$('bgImgBtn').addEventListener('click', () => $('bgImgInput').click());
$('bgImgInput').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const el = new Image();
    el.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(el.naturalWidth, el.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(el.naturalWidth * scale);
      canvas.height = Math.round(el.naturalHeight * scale);
      canvas.getContext('2d').drawImage(el, 0, 0, canvas.width, canvas.height);
      const photo = {img:canvas.toDataURL('image/jpeg', 0.8), avg:averageColor(canvas)};
      applyBgImage(photo);
      try{
        localStorage.setItem(BG_IMG_KEY, JSON.stringify(photo));
        toast('背景を写真にしました');
      }catch(err){
        toast('写真が大きすぎて保存できませんでした（今だけ表示します）');
      }
    };
    el.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
$('bgImgRemove').addEventListener('click', () => {
  applyBgImage(null);
  try{ localStorage.removeItem(BG_IMG_KEY); }catch(err){}
  let saved = null;
  try{ saved = localStorage.getItem(BG_KEY); }catch(err){}
  applyBg(/^#[0-9a-f]{6}$/i.test(saved || '') ? saved : BG_COLORS[0][0]);
});
bgSwatches.addEventListener('click', e => {
  const sw = e.target.closest('.swatch[data-color]');
  if(sw) setBg(sw.dataset.color);
});
$('bgCustom').addEventListener('input', e => setBg(e.target.value));
$('bgBtn').addEventListener('click', () => {
  menu.hidden = true;
  bgSheet.classList.add('open');
  backdrop.classList.add('open');
  bgSheet.setAttribute('aria-hidden', 'false');
  pushLayer(() => {
    bgSheet.classList.remove('open');
    backdrop.classList.remove('open');
    bgSheet.setAttribute('aria-hidden', 'true');
  });
});
$('bgClose').addEventListener('click', () => closeLayers());
(() => {
  let saved = null, photo = null;
  try{
    saved = localStorage.getItem(BG_KEY);
    photo = JSON.parse(localStorage.getItem(BG_IMG_KEY) || 'null');
  }catch(err){}
  applyBg(/^#[0-9a-f]{6}$/i.test(saved || '') ? saved : BG_COLORS[0][0]);
  if(photo && photo.img && /^#[0-9a-f]{6}$/i.test(photo.avg || '')) applyBgImage(photo);
})();

/* ---------- menu: export / import ---------- */
const menu = $('menu');
$('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
document.addEventListener('click', e => { if(!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });

$('exportBtn').addEventListener('click', () => {
  menu.hidden = true;
  // device settings (background color / photo, sort order) travel with the backup too
  const settings = {};
  try{
    settings.bg = localStorage.getItem(BG_KEY);
    settings.bgImage = JSON.parse(localStorage.getItem(BG_IMG_KEY) || 'null');
    settings.sort = localStorage.getItem('card-album-sort');
  }catch(err){}
  const data = JSON.stringify({app:'card-album', version:1, exportedAt:new Date().toISOString(), settings, cards}, null, 1);
  const a = document.createElement('a');
  const d = new Date();
  a.download = `card-album-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${cards.length}件を書き出しました`);
});
function applyImportedSettings(s){
  if(!s) return;
  const hex = /^#[0-9a-f]{6}$/i;
  if(s.bg && hex.test(s.bg)) setBg(s.bg);
  const photo = s.bgImage;
  if(photo && typeof photo.img === 'string' && photo.img.startsWith('data:image/') && hex.test(photo.avg || '')){
    applyBgImage(photo);
    try{ localStorage.setItem(BG_IMG_KEY, JSON.stringify(photo)); }catch(err){}
  }
  if(s.sort && SORTS[s.sort]){
    sortBy = s.sort;
    $('sortSelect').value = sortBy;
    try{ localStorage.setItem('card-album-sort', sortBy); }catch(err){}
  }
}
$('importBtn').addEventListener('click', () => { menu.hidden = true; $('importInput').click(); });
$('importInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const list = (data.cards || []).filter(c => c && c.id && c.title && (c.type === 'movie' || c.type === 'novel'));
    if(!list.length){ toast('読み込めるカードがありませんでした'); return; }
    await DB.putMany(list);
    cards = await DB.all();
    applyImportedSettings(data.settings);
    renderGrid();
    toast(`${list.length}件を読み込みました`);
  }catch(err){
    console.error(err);
    toast('ファイルを読み込めませんでした');
  }
});

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- start ---------- */
(async () => {
  try{
    await DB.open();
    cards = await DB.all();
    const recolored = cards.filter(c => OLD_COLORS[c.color]);
    recolored.forEach(c => { c.color = OLD_COLORS[c.color]; });
    if(recolored.length) await DB.putMany(recolored);
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }catch(err){
    console.error(err);
    toast('データを読み込めませんでした');
  }
  renderGrid();
})();
</script>
